name: CI

on:
  push:
    branches:
      - master
      - feature/**
  pull_request:

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  CONFIGURATION: Release

jobs:
  build-test:
    name: Build and Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c ${{ env.CONFIGURATION }} --no-restore

      - name: Test C#
        run: dotnet test src/PrtgAPI.Tests.UnitTests/PrtgAPI.Tests.UnitTests.csproj -c ${{ env.CONFIGURATION }} --no-build --verbosity normal

      - name: Test PowerShell
        shell: pwsh
        run: |
          Install-Module Pester -Scope CurrentUser -Force -SkipPublisherCheck
          Invoke-Pester ./src/PrtgAPI.Tests.UnitTests/PowerShell -EnableExit
